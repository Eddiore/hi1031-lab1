version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb-hi1031
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGODB_INITDB_DATABASE: Webshop
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: <PLACEHOLDER>

#  mysql:
#    image: mysql:8.4
#    container_name: mysql-hi1031
#    ports:
#      - "3306:3306"
#    volumes:
#      - mysql-data:/var/lib/mysql
#    environment:
#      MYSQL_ROOT_PASSWORD: <placeholder>

  tomcat:
    image: tomcat:jre25-temurin-jammy
    container_name: tomcat-hi1031
    ports:
      - "8080:8080"
    volumes:
      - <PLACEHOLDER>:/usr/local/tomcat/webapps/lab1.war
    depends_on:
      - mongodb

volumes:
  mysql-data:
  mongodb-data: